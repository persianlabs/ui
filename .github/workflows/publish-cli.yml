name: Publish CLI

# Manual publish for the persianlabsui npm package. Bump the version in
# packages/cli/package.json first (commit + push), then dispatch this
# workflow. Set the NPM_TOKEN repo secret to an npm automation token for
# the persianlabs account (npmjs.com → Access Tokens → Generate new
# token → Automation).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — pack and verify without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify CLI
        working-directory: packages/cli
        run: bun run typecheck && bun run test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish
      - name: Published version
        if: ${{ !inputs.dry-run }}
        run: |
          echo "Published persianlabsui@$(node -p "require('./packages/cli/package.json').version")"
