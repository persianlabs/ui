name: Publish CLI

# Manual publish for the persianlabsui npm package, via npm's GitHub
# Actions trusted publisher (OIDC) — no NPM_TOKEN secret involved.
#
# The package's trusted-publisher entry on npmjs.com must point at
# persianlabs/ui, workflow publish-cli.yml, environment "npm".
#
# Release ritual: bump the version in packages/cli/package.json, commit,
# push, then dispatch this workflow (dry-run first).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — pack and verify without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify CLI
        working-directory: packages/cli
        run: bun run typecheck && bun run test
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish
      - name: Published version
        if: ${{ !inputs.dry-run }}
        run: |
          echo "Published persianlabsui@$(node -p "require('./packages/cli/package.json').version")"
