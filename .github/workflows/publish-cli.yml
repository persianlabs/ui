name: Publish CLI

# Manual publish for the persianlabsui npm package, in two auth modes:
#  1. Classic npm token — NPM_TOKEN repo secret (publish right held by the
#     npm account that owns the package). Used when the secret exists.
#  2. Trusted publishing via OIDC — no token required once the npmjs
#     trusted-publisher entry at persianlabs/ui (workflow publish-cli.yml,
#     environment "npm") grants permission on the existing persianlabsui
#     package; without that grant npm returns E404 on the PUT.
#
# Release ritual: bump the version in packages/cli/package.json, commit,
# push, then dispatch this workflow (dry-run first).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — pack and verify without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify CLI
        working-directory: packages/cli
        run: bun run typecheck && bun run test
      # Build dist/ before npm reads package.json — otherwise npm sees no
      # dist/index.js in the checkout, warns "No bin file found" and strips
      # the bin from the published metadata.
      - name: Build CLI
        working-directory: packages/cli
        run: bun run build
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      # Deliberately no registry-url here: setup-node then skips writing an
      # .npmrc/_.authToken_ line and does not export the dummy NODE_AUTH_TOKEN
      # placeholder, so npm falls back to the ambient OIDC credential.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      # Classic-token fallback for the E404 case (OIDC grant on the existing
      # package not configured yet): inject the token only when the secret
      # exists; otherwise the OIDC path stays untouched (pure trust).
      - name: Configure npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken="$NPM_TOKEN"
          fi
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish
      - name: Published version
        if: ${{ !inputs.dry-run }}
        run: |
          echo "Published persianlabsui@$(node -p "require('./packages/cli/package.json').version")"
