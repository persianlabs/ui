name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Format check
        run: bunx prettier --check "**/*.{ts,tsx}"
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Typecheck runs after Build because tsc depends on generated artifacts
      # (.source/ from fumadocs-mdx, Next.js PageProps types) that only exist
      # after a build on a fresh checkout.
      - name: Typecheck
        run: bun run typecheck
      - name: Registry mirror parity
        run: cd apps/web && bun scripts/check-mirror-parity.mts
